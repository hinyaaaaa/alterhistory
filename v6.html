<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>AlterHistory v6</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#14161a;--bg2:#1a1d23;--bg3:#161a1f;--line:#343a44;--tx:#d9d6cc;--dim:#a1a6b0;--blue:#6fa8c9;--yellow:#d8b45a;--purple:#a58bd0;--red:#d0605a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
#v6-root{height:100%}.center{max-width:560px;margin:8vh auto;padding:0 16px}.center label{display:block;margin:10px 0}
input,select,button{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font:inherit;margin:2px}button{cursor:pointer}button:hover{border-color:var(--blue)}button.on{border-color:var(--yellow);color:var(--yellow)}
#app{display:grid;grid-template-columns:92px 340px 1fr 260px;height:100%}#hub{background:var(--bg3);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:6px;gap:4px;overflow:auto}#hub button{text-align:left}
#panel{border-right:1px solid var(--line);overflow:auto;padding:10px;background:var(--bg2)}#mapwrap{position:relative;overflow:hidden;background:#0f1114;display:flex;align-items:center}#map{width:100%;display:block;cursor:crosshair}.layers{position:absolute;top:6px;left:6px;z-index:2}
#banner{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:rgba(20,22,26,.85);color:var(--yellow)}#banner:empty{display:none}
#clock{border-left:1px solid var(--line);background:var(--bg2);padding:10px;overflow:auto}.date{font-size:20px;color:var(--yellow)}.feed .news{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.dim{color:var(--dim);font-size:12px}.lk{color:var(--blue)}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:3px 5px;text-align:left}.item{padding:4px 6px;cursor:pointer;border-radius:3px}.item:hover,.item.on{background:var(--bg3)}.sw{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}
.bar{display:inline-block;width:80px;height:8px;background:var(--bg3);border:1px solid var(--line);vertical-align:middle}.bar i{display:block;height:100%}.tabs{margin:8px 0}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px}.warn{color:var(--yellow);font-size:12px}
#newsmodal{position:fixed;inset:0;background:rgba(8,9,11,.93);display:flex;align-items:center;justify-content:center;z-index:50}#newsmodal[hidden]{display:none}.modalbox{max-width:640px;padding:28px;border:1px solid var(--yellow);background:var(--bg2);text-align:center}.modalbox h2{font-size:26px;margin:14px 0}
.vlist .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-bottom:1px solid var(--line)}
@media (max-width:1100px){#app{grid-template-columns:80px 280px 1fr}#clock{display:none}}
</style></head><body><div id="v6-root"></div><script src="dist/v6.js"></script></body></html>
