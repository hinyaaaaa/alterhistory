<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>AlterHistory v6</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#14161a;--bg2:#1a1d23;--bg3:#161a1f;--line:#343a44;--tx:#d9d6cc;--dim:#a1a6b0;--blue:#6fa8c9;--yellow:#d8b45a;--purple:#a58bd0;--red:#d0605a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 "Shippori Mincho","Noto Serif JP","Noto Serif CJK JP","Yu Mincho","Hiragino Mincho ProN","MS PMincho",serif;overflow:hidden;font-variant-numeric:tabular-nums}
#app{display:flex;height:100%}
#hub{width:64px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:6px 0;overflow-y:auto}

#hub button.on small{color:var(--yellow)}
#panel{width:0;flex:none;overflow:hidden;background:var(--bg2);border-right:1px solid var(--line);transition:width .18s}
#panel.open{width:var(--pw,320px)}
#pin{width:var(--pw,320px);padding:12px 14px 20px;height:100%;overflow-y:auto}
#pin h2{margin:0;font-size:19px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}

.code::before{content:"";width:22px;height:2px;background:var(--yellow)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 10px}
.tabs b{font-weight:400;font-size:12px;padding:2px 9px;border:1px solid var(--line);color:var(--dim);cursor:pointer}

.chips{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 10px}

.dot{width:8px;height:8px;flex:none}

.sw{width:22px;height:12px;border:1px solid var(--line);flex:none}
button.b{font:inherit;font-size:12px;background:none;color:var(--tx);border:1px solid var(--line);padding:2px 8px;cursor:pointer}

p.n{color:var(--dim);font-size:12px;margin:8px 0}
.lb{font-size:13px;letter-spacing:.08em;color:#b9b5a8;display:flex;align-items:center;gap:7px;margin:14px 0 6px}.lb em{font-style:normal;font-size:11px;letter-spacing:.16em;color:#838995}

#mapwrap{flex:1;position:relative;min-width:0;background:#0f1114}

.ev{border-left:3px solid var(--blue);padding:2px 8px;margin:0 0 9px;font-size:12px}
.ev time{color:var(--dim);display:block}.ev.y{border-color:var(--yellow)}.ev.p{border-color:var(--purple)}.ev .why{color:var(--dim)}
#pops{position:absolute;top:10px;right:10px;width:290px;z-index:6;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.pop{pointer-events:auto;position:relative;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--purple);padding:8px 28px 8px 10px;font-size:12px;box-shadow:0 6px 18px #000a;animation:pin .25s ease-out}
.pop.w{border-left-color:var(--yellow)}
.pop b{display:block;font-size:13px;font-weight:600}
.pop i{position:absolute;top:4px;right:9px;cursor:pointer;color:var(--dim);font-style:normal}
@keyframes pin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#clock{position:absolute;right:10px;bottom:10px;background:var(--bg2);border:1px solid var(--line);padding:6px 10px;z-index:4;font-size:12px;text-align:right}
#clock .d{font-size:16px}
#clock .c{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
#clock .c button{font:inherit;background:none;color:var(--tx);border:1px solid var(--line);padding:1px 8px;cursor:pointer}

#leg{position:absolute;left:10px;bottom:10px;background:#14161acc;border:1px solid var(--line);padding:6px 10px;font-size:12px;color:var(--dim);z-index:3}
#hint{position:absolute;left:10px;top:10px;background:#14161acc;border:1px solid var(--line);padding:4px 10px;font-size:12px;color:var(--dim);z-index:3}

#pin h2{font-weight:400;letter-spacing:.1em;font-size:20px}
.tabs{gap:2px 14px;margin:8px 0 12px}
.tabs b{border:0;border-bottom:1px solid transparent;padding:2px 1px;background:none}
.tabs b.on{color:var(--tx);background:none;border-bottom-color:var(--yellow)}
.card{border:0;border-left:1px solid var(--yellow);background:var(--bg3)}
.st b{font-weight:400;font-size:22px}
.rs{animation:rise .38s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.bar i{transform-origin:left center;animation:growx .8s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:growx .9s .35s ease-out both}
.tn{animation:rise .4s ease-out both}
.np{transform-box:fill-box;transform-origin:center;animation:popn .4s ease-out both}

.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .2s ease-out forwards}

.fl-line{stroke-dasharray:10 6;animation:march 1.2s linear infinite}

.fg.hot .fl-line{stroke-width:7}
.fg.hot .fmk{animation:none;fill:#d0605a}
#callout{animation:pin2 .18s ease-out}
@keyframes pin2{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.tl{border-left:1px solid var(--line);margin:6px 0 0 5px}
.tl>div{position:relative;padding:0 0 13px 15px;font-size:13px}
.tl>div::before{content:"";position:absolute;left:-4px;top:7px;width:7px;height:7px;background:var(--yellow);transform:rotate(45deg)}
.tl small{display:block;color:var(--dim)}
.cand{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.cand span:first-child{width:46px}
.cand .bar{flex:1;height:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.st small{font-size:12px}
.row:hover,.fr[data-f]:hover{background:#20242b}.fr[data-f]{cursor:pointer}
.rc:hover{outline:1px solid var(--tx)}.mx td.pk,.fn.pk rect:first-child{outline:2px solid var(--yellow);stroke:#d8b45a;stroke-width:2.5}
.still .rs,.still .np,.still .tn,.still .bar i,.still .grow,.still .blk i{animation:none}.still .dr{animation:none;stroke-dashoffset:0}
body.paused *{animation-play-state:paused!important}
.pop{border-left-width:4px}.pop.kr{border-left-color:var(--red)}.pop.kp{border-left-color:var(--purple)}.pop.kn{border-left-color:#838995}
.tg{font-size:11px;border:1px solid;padding:0 5px;margin-right:6px;letter-spacing:.1em}
.pop .bt{display:flex;gap:6px;margin-top:6px}
.cmd input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);padding:8px 10px;font:inherit;margin-bottom:8px}.cmd input:focus{outline:none;border-color:var(--yellow)}
.hit{cursor:pointer}
.big{font-size:34px;font-weight:400;line-height:1.2;margin:4px 0 8px}.big small{font-size:12px;color:var(--dim);margin-left:8px}
.blk{display:flex;flex-wrap:wrap;gap:2px;max-width:330px}.blk i{width:10px;height:10px;display:block;animation:popn .3s ease-out both}.pips{display:flex;align-items:center;gap:3px}.pips i{width:22px;height:8px;display:block}.pips small{margin-left:8px;color:var(--dim)}
.hr{display:flex;gap:14px}#pin h2 b{font-weight:400}
.back{font-size:13px;color:var(--dim);cursor:pointer;margin-bottom:8px}.back:hover{color:var(--tx)}
.head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.portrait{width:64px;height:64px;flex:none;border:1px solid var(--line);overflow:hidden}
.lkc{cursor:pointer}.lk{cursor:pointer;border-bottom:1px dotted #838995}.lk:hover{color:var(--yellow);border-color:var(--yellow)}.lk.sm{font-size:12px;color:var(--dim)}
.st.g3{grid-template-columns:repeat(3,1fr)}.st div.lkc:hover{border-color:#838995}.st div.pk{border-color:var(--yellow)}
.slot{border-left:1px solid var(--yellow);background:var(--bg3);padding:8px 10px;margin:10px 0}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lgi{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0}.lgi i{width:14px;height:10px;display:block;flex:none}.lgi.sm{color:var(--dim);margin-top:6px}
.lgi i.ln{height:0;border-top:2px solid #4b6572}.lgi i.ln.red{border-color:#d0605a;border-top-style:dashed}.lgi i.dots{height:0;border-top:3px dotted #cfc9b8}
.lgi i.hatch{background:repeating-linear-gradient(45deg,#e8e2d0 0 2px,transparent 2px 6px)}.lgi i.gridp{background:linear-gradient(#e8e2d088 1px,transparent 1px) 0 0/5px 5px,linear-gradient(90deg,#e8e2d088 1px,transparent 1px) 0 0/5px 5px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #262a31}.lrow .g{flex:1}.lrow small{color:var(--dim)}.car{color:var(--dim)}
.legend{padding:6px 0 8px 26px;border-bottom:1px solid #262a31}

.ctl{display:flex;gap:4px;align-items:center}

.dg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.dcard{border:1px solid var(--line);padding:4px 8px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}.dcard:hover{border-color:#838995}.dcard.pk{border-color:var(--yellow)}.dcard .pips i{width:8px;height:8px}
.two label.fld{margin:0 0 8px}

#pin.tmode{overflow:hidden;padding:8px 10px 0}

.tbar .tt{display:flex;gap:14px;flex:1}.tbar .tt b{font-weight:400;color:var(--dim);cursor:pointer;padding:2px;border-bottom:1px solid transparent}.tbar .tt b:hover{color:var(--tx)}.tbar .tt b.on{color:var(--tx);border-bottom-color:var(--yellow)}
.tbar .zc{display:flex;gap:4px}.tbar .xx{cursor:pointer;color:var(--dim);font-size:20px;padding:0 4px}

<style>
